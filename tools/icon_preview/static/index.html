<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Preview</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Icon Preview</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="picker">Picker</button>
      <button class="tab" data-tab="units">Units</button>
    </nav>
  </header>

  <main id="picker-panel" class="panel active">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Поиск: key, BTN, path…" autofocus>
      <select id="folder-filter">
        <option value="all">All icons</option>
        <option value="CommandButtons">CommandButtons</option>
        <option value="PassiveButtons">PassiveButtons</option>
        <option value="AutocastButtons">AutocastButtons</option>
        <option value="Custom">Custom</option>
      </select>
      <label class="checkbox">
        <input id="show-unavailable" type="checkbox">
        Показать недоступные
      </label>
      <span id="picker-count" class="muted"></span>
    </div>
    <div class="picker-layout">
      <div id="icon-grid" class="icon-grid"></div>
      <aside id="picker-detail" class="detail">
        <div class="detail-empty">Выберите иконку</div>
      </aside>
    </div>
  </main>

  <main id="units-panel" class="panel">
    <div class="toolbar">
      <select id="faction-filter"></select>
      <label class="checkbox">
        <input id="show-parent-only" type="checkbox">
        Подсветить parent-only
      </label>
      <span id="reload-status" class="muted"></span>
    </div>
    <div class="units-layout">
      <section id="faction-view" class="faction-view"></section>
      <aside id="unit-detail" class="detail">
        <div class="detail-empty">Выберите юнита</div>
      </aside>
    </div>
  </main>

  <div id="assign-banner" class="assign-banner hidden">
    Назначение для <strong id="assign-target"></strong>
    <button id="assign-clear" type="button">×</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
